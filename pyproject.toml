[project]
name = "qwen-inference"
version = "0.1.0"
description = "Reproducible CPU and AMD ROCm benchmarks for local llama.cpp inference"
readme = "README.md"
authors = [
    { name = "ajthkmr", email = "ajiiitth@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "openai>=3.37.0",
    "pandas>=3.1.0",
    "psutil>=7.2.2",
    "pytest>=9.1.1",
]

[project.scripts]
qwen-inference = "qwen_inference:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
